[[item]]
id = "N4"
group = "no_search"
block = "do_not_search"
# The conversation itself, on a topic the corpus also covers: the text to work on is
# in the message, so a search can only add noise.
prompt = """Сократи до одного предложения: «Командировка — это поездка работника по распоряжению руководителя для выполнения служебного поручения вне места постоянной работы. Она оформляется приказом, а расходы возмещаются по правилам компании.»"""
search = false
answer = ['командиров']
allowed = []

[[item]]
id = "W1"
group = "thin"
block = "thin_results"
# Nothing in the corpus mentions parking. A correct run searches, tries at most a
# couple of rewordings, and says the documents are silent instead of inventing a policy.
prompt = "Как у нас компенсируется парковка для сотрудников?"
search = true
max_queries = 3
answer = ['не\s+(на[шй]\w*|удалось|содерж|упомина|нашлось|описан)|нет\s+(информации|сведений|данных|упоминани)|отсутству|ничего\s+не']
# The nearest thing the corpus has — П-14 on travel inside the office's city — is a
# fair thing to say, and then a fair thing to cite.
allowed = ["Регламенты/П-14 Командировки.md"]
cite_optional = true
probes = ["компенсация парковки сотрудникам", "парковка"]

[[item]]
id = "W2"
group = "thin"
block = "thin_results"
# The corpus never says "NDA"; the document is titled in full Russian. A run that
# stops after the literal query answers from the wrong documents or not at all.
prompt = "Как оформить NDA с подрядчиком?"
search = true
max_queries = 3
answer = ['документооборот|Договорные шаблоны|типов\w+\s+форм', 'директор\w*\s+по\s+правовым']
allowed = ["Юридическое/Соглашение о неразглашении — порядок.md"]
probes = ["NDA с подрядчиком", "оформить NDA", "NDA"]
good_probes = ["соглашение о неразглашении", "соглашение о конфиденциальности с контрагентом"]

[[item]]
id = "W3"
group = "thin"
block = "thin_results"
