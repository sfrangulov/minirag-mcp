[project]
name = "minirag-mcp"
version = "0.1.0"
description = "Local-first RAG MCP server: hybrid search over your documents, fully local"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=3.4",
    "lancedb>=0.36",
    "fastembed>=0.8",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.7",
    "cyclopts>=4.0",
    "platformdirs>=4.0",
    # markitdown already pulls this in, but we import it directly: the URL fetch runs
    # through a requests session we build and guard ourselves.
    "requests>=2.32",
]

[project.scripts]
minirag-mcp = "minirag_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minirag_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.6"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: needs the real embedding model (downloads ~220 MB)"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
