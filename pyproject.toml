[project]
name = "minirag-mcp"
version = "2.0.0a3"
description = "Local-first RAG MCP server: hybrid search over your documents, fully local"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = [
    # 4.x moves to mcp 2.x and is untested here; the lock would keep CI on 3.x while an
    # unconstrained `uvx minirag-mcp` resolved 4.x.
    "fastmcp>=3.4,<4",
    # fastmcp already pulls these in, but we import them directly: `serve` runs uvicorn
    # itself, and its guards are Starlette middleware. uvicorn's bound is the floor of
    # fastmcp 3.4.0's [server] extra, and Starlette's is mcp's, which fastmcp 3.4.0
    # inherits, so declaring them can never move the resolution.
    "uvicorn>=0.35",
    "starlette>=0.27",
    "lancedb>=0.36",
    "fastembed>=0.8",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.7",
    "cyclopts>=4.0",
    "platformdirs>=4.0",
    # markitdown already pulls this in, but we import it directly: the URL fetch runs
    # through a requests session we build and guard ourselves.
    "requests>=2.32",
    # fastembed already pulls this in, but we import it directly: the chunker's token
    # counter is built from a copy of the model's own tokenizer with truncation off.
    "tokenizers>=0.15",
    # fastembed already pulls this in, but we import it directly: with an embedding
    # endpoint, the model's tokenizer.json is fetched alone, without the ONNX model.
    "huggingface-hub>=0.20",
    # markitdown[pdf] already pulls this in, but we import it directly: OCR routing
    # counts a PDF's text per page with pdfminer's own layout pass, and that import
    # runs at startup on every install, extra or not. The bound matches the floor
    # markitdown[pdf] already imposes, so declaring it can never move the resolution.
    "pdfminer.six>=20251230",
    # markitdown already pulls this in, but we import it directly: a .vtt that is not
    # UTF-8 is decoded by its detection. markitdown declares it with no floor; 3.0 is
    # the floor of the converter ingest/vtt.py is adapted from.
    "charset-normalizer>=3.0",
    "pathspec>=0.12",
    # lancedb already pulls this in, but we import it directly: look-alike signatures are
    # computed and compared as arrays. The bound is lancedb's own floor, so declaring it
    # can never move the resolution.
    "numpy>=1.24",
    # fastmcp already pulls this in, but we import it directly: a call runs in a worker
    # thread that the cancellation of its request abandons.
    "anyio>=4.5",
]

[project.scripts]
minirag-mcp = "minirag_mcp.__main__:main"

[project.optional-dependencies]
ocr = [
    # Wheels bundle libtesseract 5.5.4 for macOS 15+, manylinux, musllinux and Windows;
    # anywhere else pip builds it from source against a system Tesseract.
    "tesserocr>=2.13",
    # pdfplumber already pulls these in, but we import them directly: PDF pages are
    # rendered with pypdfium2 and image files decoded with Pillow. Pillow's bound is at
    # fastembed's own floor, so declaring it can never move the resolution; pypdfium2's
    # is above the 4.18 that pdfplumber 0.11.9, markitdown's floor, would accept.
    "pypdfium2>=5",
    "pillow>=10.3",
    # Apple Vision, the second reader of the pages Tesseract is unsure of, on macOS only.
    "pyobjc-framework-Vision>=13; sys_platform == 'darwin'",
    # pyobjc-framework-Vision already pulls these in, but we import them directly: the
    # region each request reads is a Quartz rectangle, and every call drains its own
    # autorelease pool. Both bounds are Vision 13's own floors, so declaring them can
    # never move the resolution.
    "pyobjc-framework-Quartz>=13; sys_platform == 'darwin'",
    "pyobjc-core>=13; sys_platform == 'darwin'",
]
classify = [
    "llama-cpp-python>=0.3.36",
    # llama-cpp-python already pulls this in, but we import it directly: the readout
    # views llama.cpp's logits buffer as an array.
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minirag_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.6", "bump-my-version>=1.5.1"]

# `uv run bump-my-version bump <major|minor|patch>` does the whole release
# prologue: rewrite `version` above, commit it, tag it. It never pushes — the
# push is what makes a version number real on PyPI, and everything up to it is
# still reversible, so that stays a separate, deliberate command.
#
# `__version__` is derived from installed metadata, so `version` in [project]
# is the only place a number lives and the only thing this has to rewrite.
[tool.bumpversion]
current_version = "2.0.0a3"
commit = true
message = "chore: release v{new_version}"
tag = true
# release.yml strips one leading "v" from the tag before comparing it against
# the built wheel's version, so the tag has to be spelled exactly this way.
# Change one without the other and a release either fails that check or needs
# a retag after the fact.
tag_name = "v{new_version}"
tag_message = "v{new_version}"
sign_tags = false
# A bump has to be the only thing in its commit; refuse to sweep up whatever
# else happens to be in the tree.
allow_dirty = false
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:(?P<pre_l>a|b|rc)(?P<pre_n>\d+))?'
serialize = ["{major}.{minor}.{patch}{pre_l}{pre_n}", "{major}.{minor}.{patch}"]

[tool.bumpversion.parts.pre_l]
values = ["a", "b", "rc", "final"]
optional_value = "final"
# major/minor/patch reset pre_l to its first value; "final" keeps `bump patch` a final release.
first_value = "final"

[tool.bumpversion.parts.pre_n]
first_value = "1"

# bump-my-version 1.5.1 also rewrites `project.version` unprompted, but that is
# not documented configuration and a release now depends on that line being
# right, so it is pinned here too. The two agree; the line is simply written
# twice. Anchored to a whole line because `current_version = "0.1.0"` above
# ends in the same `version = "0.1.0"` text, which a bare search would match.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '^version = "{current_version}"$'
replace = 'version = "{new_version}"'

# uv.lock pins this project's own version alongside its dependencies. Left out,
# it stays a release behind until the next `uv run` rewrites it — and that dirty
# file then blocks the *following* bump, because allow_dirty is false. Bumping
# it here keeps the lock in the release commit where it belongs. Anchored to the
# minirag-mcp package block, since other packages in the lock have their own
# `version = ` lines.
[[tool.bumpversion.files]]
filename = "uv.lock"
regex = true
search = 'name = "minirag-mcp"\nversion = "{current_version}"'
replace = 'name = "minirag-mcp"\nversion = "{new_version}"'

# server.json is the MCP Registry's copy of this release, and it spells the
# version twice: once for the server entry and once for the PyPI package it
# points at. Both must equal the tag — publish-mcp.yml refuses a tag that
# disagrees with either, and the registry itself rejects a re-publish of a
# version it already holds, so a stale server.json fails the publish of a tag
# whose wheel is already on PyPI, and the only way out of that is another
# release. The two lines differ only by indentation, so they get one entry
# each, anchored to whole lines; a single unanchored search would rewrite
# whichever bump-my-version happened to reach first and silently leave the
# other behind. tests/test_scaffold.py asserts both against pyproject.toml.
[[tool.bumpversion.files]]
filename = "server.json"
regex = true
search = '^  "version": "{current_version}",$'
replace = '  "version": "{new_version}",'

[[tool.bumpversion.files]]
filename = "server.json"
regex = true
search = '^      "version": "{current_version}",$'
replace = '      "version": "{new_version}",'

[tool.pytest.ini_options]
addopts = "-m 'not slow and not classify'"
markers = [
    "slow: needs the real embedding models (downloads ~2.5 GB)",
    "classify: needs the [classify] extra and a local GGUF named by MINIRAG_TEST_GGUF",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Verbatim excerpts from the real corpus. Rewrapping a markdown table row or a
# transcript turn would change the very shape the chunker is being tested against.
"tests/corpus_samples.py" = ["E501"]
